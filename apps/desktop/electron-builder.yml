appId: com.jobautomation.desktop
productName: JobAutomation
directories:
  output: release
files:
  - dist/**/*
  - package.json
win:
  target: nsis
  icon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: Amro212
  repo: JobAutomation

asar: true
appId: com.jobautomation.desktop
productName: JobAutomation
icon: resources/icon.png
directories:
  output: release
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - node_modules/**/*
  - package.json
afterPack: scripts/patch-win-icon.cjs
extraResources:
  - from: dist/api
    to: api
  # icon.ico is also set in win.icon (embedded into the exe by electron-builder).
  # The extraResources copy is needed so app-icon.ts can load it at runtime for
  # BrowserWindow.icon and the system tray.
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
win:
  icon: resources/icon.ico
  target: nsis
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
publish:
  provider: github
  owner: Amro212
  repo: JobAutomation

asar: true
appId: com.jobautomation.desktop
productName: JobAutomation
icon: resources/icon.png
directories:
  output: release
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: dist/api
    to: api
win:
  target: nsis
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: Amro212
  repo: JobAutomation

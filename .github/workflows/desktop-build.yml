name: desktop-build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run Vitest
        run: corepack pnpm test

      - name: Build desktop runtime
        run: |
          corepack pnpm --filter @jobautomation/desktop build:main
          corepack pnpm --filter @jobautomation/desktop build:renderer
          corepack pnpm --filter @jobautomation/desktop build:api

      - name: Install Playwright browsers
        run: corepack pnpm playwright install

      - name: Run desktop integration tests
        run: corepack pnpm test:desktop-integration

  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build desktop release
        run: corepack pnpm build:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
